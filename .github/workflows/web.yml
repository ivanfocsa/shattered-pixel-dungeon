# Builds the browser version (TeaVM) and publishes it on GitHub Pages.
# Enable it once in the repository: Settings > Pages > Source: "GitHub Actions".
name: Web build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web release
        run: ./gradlew web:gdx_teavm_web_js_release_build --no-daemon
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist/js/release/webapp

  # pull requests only check that the web version compiles
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
